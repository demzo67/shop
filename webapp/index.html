<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #d6336c);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f4f4f6);
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); padding-bottom: 96px; }
  .hidden { display: none !important; }
  header { padding: 16px 16px 4px; }
  h1 { font-size: 22px; }
  .sub { color: var(--hint); font-size: 14px; margin-top: 2px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 14px; border: 0; border-radius: 20px; background: var(--card);
          color: var(--text); font-size: 14px; }
  .chip.active { background: var(--accent); color: var(--accent-text); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px; }
  .card { background: var(--card); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .pic { position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
         font-size: 56px; background: rgba(127,127,127,.12); }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .info { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .name { font-weight: 600; font-size: 14px; }
  .desc { color: var(--hint); font-size: 12px; line-height: 1.35; }
  .price { font-weight: 700; margin-top: auto; padding-top: 6px; }
  .add, .primary { border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text);
                   font-size: 14px; font-weight: 600; padding: 10px; width: 100%; }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .stepper button { width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--accent);
                    color: var(--accent-text); font-size: 20px; line-height: 1; }
  .stepper span { font-weight: 700; min-width: 24px; text-align: center; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
         background: var(--bg); box-shadow: 0 -2px 12px rgba(0,0,0,.08); }
  .bar .primary { padding: 14px; font-size: 16px; }
  .empty { text-align: center; color: var(--hint); padding: 48px 16px; }
  section { padding: 0 16px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid rgba(127,127,127,.2); }
  .row .t { flex: 1; font-size: 14px; }
  .row .t b { display: block; }
  .row .t small { color: var(--hint); }
  .total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; padding: 16px 0; }
  h2 { font-size: 17px; margin: 14px 0 8px; }
  input[type=text], input[type=tel], textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px;
         border: 1px solid rgba(127,127,127,.3); background: var(--card); color: var(--text); font-size: 15px;
         font-family: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  .pay { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; background: var(--card);
         margin-bottom: 8px; font-size: 15px; }
  .pay input { accent-color: var(--accent); }
  .back { border: 0; background: none; color: var(--accent); font-size: 15px; padding: 14px 16px 0; }
</style>
</head>
<body>

<!-- ============ SHOP ============ -->
<div id="shop">
  <header>
    <h1 id="title">Do'kon</h1>
    <div class="sub">Mahsulotni tanlang va savatga qo'shing</div>
  </header>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="bar hidden" id="bar">
    <button class="primary" id="open-cart">🛒 Savat · <span id="bar-count"></span> · <span id="bar-total"></span></button>
  </div>
</div>

<!-- ============ CART + CHECKOUT ============ -->
<div id="cart" class="hidden">
  <button class="back" id="back">← Do'konga qaytish</button>
  <section>
    <h2>Savat</h2>
    <div id="cart-list"></div>
    <div class="total"><span>Jami</span><span id="cart-total"></span></div>

    <h2>Yetkazib berish</h2>
    <input type="text" id="f-name" placeholder="Ismingiz" autocomplete="name">
    <input type="tel" id="f-phone" placeholder="Telefon raqami (+998 ...)" autocomplete="tel">
    <input type="text" id="f-address" placeholder="Manzil (shahar, ko'cha, uy)" autocomplete="street-address">
    <textarea id="f-comment" placeholder="Izoh (ixtiyoriy)"></textarea>

    <h2>To'lov usuli</h2>
    <label class="pay"><input type="radio" name="pay" value="cash" checked> 💵 Naqd pul (yetkazilganda)</label>
    <label class="pay"><input type="radio" name="pay" value="card"> 💳 Karta orqali o'tkazma</label>

    <div style="height:16px"></div>
    <button class="primary" id="submit" style="padding:14px;font-size:16px">✅ Buyurtmani tasdiqlash</button>
    <div style="height:32px"></div>
  </section>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let data = { shop: "Do'kon", currency: "so'm", products: [] };
const cart = {};          // product id (string) -> quantity
let activeCat = "Hammasi";

const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " " + data.currency;
const byId = id => data.products.find(p => String(p.id) === String(id));
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
const total = () => Object.entries(cart).reduce((s, [id, q]) => s + (byId(id) ? byId(id).price * q : 0), 0);
const warn = msg => (tg && tg.showAlert) ? tg.showAlert(msg) : alert(msg);

// ---------- load products ----------
fetch("products.json?v=" + Date.now())
  .then(r => r.json())
  .then(j => { data = j; init(); })
  .catch(() => { $("#grid").innerHTML = '<div class="empty">Mahsulotlarni yuklab bo\'lmadi. Keyinroq urinib ko\'ring.</div>'; });

function init() {
  $("#title").textContent = data.shop || "Do'kon";
  document.title = data.shop || "Do'kon";
  const cats = ["Hammasi", ...new Set(data.products.map(p => p.category))];
  $("#chips").innerHTML = cats.map(c =>
    `<button class="chip${c === activeCat ? " active" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  renderGrid();
  prefill();
}

// ---------- shop view ----------
function renderGrid() {
  const list = data.products.filter(p => activeCat === "Hammasi" || p.category === activeCat);
  $("#grid").innerHTML = list.map(p => {
    const id = String(p.id), q = cart[id] || 0;
    const img = p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.style.display='none'">` : "";
    const control = q === 0
      ? `<button class="add" data-act="inc" data-id="${esc(id)}">Savatga</button>`
      : `<div class="stepper"><button data-act="dec" data-id="${esc(id)}">−</button><span>${q}</span><button data-act="inc" data-id="${esc(id)}">+</button></div>`;
    return `<div class="card">
      <div class="pic"><span>${esc(p.emoji || "💄")}</span>${img}</div>
      <div class="info">
        <div class="name">${esc(p.name)}</div>
        <div class="desc">${esc(p.description)}</div>
        <div class="price">${fmt(p.price)}</div>
        ${control}
      </div></div>`;
  }).join("") || '<div class="empty">Bu bo\'limda mahsulot yo\'q.</div>';
  updateBar();
}

function updateBar() {
  const n = count();
  $("#bar").classList.toggle("hidden", n === 0);
  $("#bar-count").textContent = n + " ta";
  $("#bar-total").textContent = fmt(total());
}

function change(id, delta) {
  id = String(id);
  const q = Math.max(0, Math.min(50, (cart[id] || 0) + delta));
  if (q === 0) delete cart[id]; else cart[id] = q;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  if ($("#cart").classList.contains("hidden")) renderGrid(); else renderCart();
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) {
    activeCat = chip.dataset.cat;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === chip));
    return renderGrid();
  }
  const b = e.target.closest("[data-act]");
  if (b) change(b.dataset.id, b.dataset.act === "inc" ? 1 : -1);
});

// ---------- cart view ----------
function showCart() {
  $("#shop").classList.add("hidden");
  $("#cart").classList.remove("hidden");
  window.scrollTo(0, 0);
  renderCart();
  if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(showShop); }
}

function showShop() {
  $("#cart").classList.add("hidden");
  $("#shop").classList.remove("hidden");
  if (tg && tg.BackButton) { tg.BackButton.hide(); tg.BackButton.offClick(showShop); }
  renderGrid();
}

function renderCart() {
  const ids = Object.keys(cart);
  if (ids.length === 0) return showShop();
  $("#cart-list").innerHTML = ids.map(id => {
    const p = byId(id); if (!p) return "";
    return `<div class="row">
      <div class="t"><b>${esc(p.name)}</b><small>${fmt(p.price)} × ${cart[id]} = ${fmt(p.price * cart[id])}</small></div>
      <div class="stepper"><button data-act="dec" data-id="${esc(id)}">−</button><span>${cart[id]}</span><button data-act="inc" data-id="${esc(id)}">+</button></div>
    </div>`;
  }).join("");
  $("#cart-total").textContent = fmt(total());
}

$("#open-cart").addEventListener("click", showCart);
$("#back").addEventListener("click", showShop);

// ---------- remember the customer's details on this phone ----------
function prefill() {
  try {
    const s = JSON.parse(localStorage.getItem("customer") || "{}");
    $("#f-name").value = s.name || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "") || "";
    $("#f-phone").value = s.phone || "";
    $("#f-address").value = s.address || "";
  } catch (e) {}
}
function remember(f) {
  try { localStorage.setItem("customer", JSON.stringify({ name: f.name, phone: f.phone, address: f.address })); } catch (e) {}
}

// ---------- send the order to the bot ----------
$("#submit").addEventListener("click", () => {
  const f = {
    name: $("#f-name").value.trim(),
    phone: $("#f-phone").value.trim(),
    address: $("#f-address").value.trim(),
    comment: $("#f-comment").value.trim(),
    payment: document.querySelector('input[name="pay"]:checked').value
  };
  if (!f.name) return warn("Ismingizni kiriting");
  if (f.phone.replace(/\D/g, "").length < 9) return warn("Telefon raqamini to'g'ri kiriting");
  if (!f.address) return warn("Manzilni kiriting");
  const items = Object.entries(cart).filter(([, q]) => q > 0).map(([id, qty]) => ({ id, qty }));
  if (items.length === 0) return warn("Savat bo'sh");
  if (!tg || !tg.sendData) return alert("Bu sahifa Telegram ichida, botdagi «Do'konni ochish» tugmasi orqali ochilishi kerak.");
  remember(f);
  tg.sendData(JSON.stringify({ ...f, items }));   // closes the app and delivers the order to the bot
});
</script>
</body>
</html>
